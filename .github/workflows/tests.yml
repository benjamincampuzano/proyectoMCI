name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Cancelar ejecuciones previas de la misma rama para ahorrar tiempo
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================
  # Tests del cliente (React + Vitest + jsdom)
  # ===========================================================
  client-tests:
    name: Cliente (Vitest + RTL)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: client
        run: pnpm run lint

      - name: Tests + cobertura
        working-directory: client
        run: pnpm run test:coverage

      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-coverage
          path: client/coverage/
          retention-days: 14

  # ===========================================================
  # Tests del servidor (Node + Vitest)
  # Postgres como service container para tests que lo requieran
  # ===========================================================
  server-tests:
    name: Servidor (Vitest + Node)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test_db
      JWT_SECRET: test-jwt-secret-for-ci
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar cliente Prisma
        working-directory: server
        run: pnpm run generate

      - name: Migrar schema a DB de test
        working-directory: server
        run: pnpm exec prisma migrate deploy --schema=prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db

      - name: Tests + cobertura
        working-directory: server
        run: pnpm run test:coverage

      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: server/coverage/
          retention-days: 14

  # ===========================================================
  # Resumen: si ambos tests pasan, todo OK
  # ===========================================================
  all-tests:
    name: ✅ Resumen
    runs-on: ubuntu-latest
    needs: [client-tests, server-tests]
    if: always()
    steps:
      - name: Verificar resultado
        run: |
          if [ "${{ needs.client-tests.result }}" != "success" ] || \
             [ "${{ needs.server-tests.result }}" != "success" ]; then
            echo "❌ Algún job de tests falló."
            echo "  Cliente: ${{ needs.client-tests.result }}"
            echo "  Servidor: ${{ needs.server-tests.result }}"
            exit 1
          fi
          echo "✅ Todas las suites de tests pasaron."
